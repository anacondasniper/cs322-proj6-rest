services:
  db:
    image: mongo:7

  brevets:
    build: ./brevets
    volumes:
      - ./brevets:/todo
    ports:
      - 5002:5000
    depends_on:
      - db

  laptop-service:
    build: ./laptop
    volumes:
      - ./laptop:/usr/src/app
    ports:
      - 5001:80
    depends_on:
      - db

  website:
    image: php:apache
    volumes:
      - ./website:/var/www/html
    ports:
      - 5000:80
    depends_on:
      - laptop-service
